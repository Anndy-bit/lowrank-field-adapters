# S³ Standard Configuration
# Target: GTX 1050 (2GB VRAM), Qwen2.5-7B-Instruct, Alpaca 52K

experiment:
  name: s3_standard_qwen7b_alpaca
  description: "S³ fine-tuning on Qwen2.5-7B-Instruct with Alpaca dataset"
  seed: 42
  n_runs: 3

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: fp16
  max_seq_length: 512
  svd_dir: ./svd_factors/qwen2.5-7b/

s3:
  svmo_k: 128
  svmo_hidden: 32
  svmo_alpha: 0.3
  nmf_bottleneck: 8
  nmf_T: 1.0
  nmf_N: 4
  nmf_solver: rk4
  stb_head_dim: 32
  stb_beta: 0.5

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 128
  learning_rate: 1.0e-3
  weight_decay: 0.01
  betas: [0.9, 0.999]
  max_epochs: 3
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  use_amp: true
  amp_dtype: fp16
  log_interval: 10

data:
  dataset: alpaca
  path: tatsu-lab/alpaca
  split: train
  preprocessing:
    format: instruction_output
    instruction_key: instruction
    output_key: output
    prompt_template: "### Instruction:\n{instruction}\n\n### Response:\n{output}"

benchmarks:
  - mmlu
  - hellaswag
  - arc
  - gsm8k

output:
  checkpoint_dir: ./checkpoints/s3_qwen7b_alpaca/
  results_dir: ./results/s3_qwen7b_alpaca/
  vram_log: ./results/s3_qwen7b_alpaca/vram_trace.csv

s3_opt:
  use_smv: true           # Delta-modulación vector para transferencia PCIe
  use_emp: true           # Predicción de μ desde Adam moments
  use_ter: true           # Routing ODE por entropía (N∈{1,2,4})
  use_fdgd: true          # Filtrado de gradientes en dominio Fourier
  use_gns: true           # Skip backward por norma de gradiente
  use_sma: true           # Checkpoints espectrales (compresión 16x)
  use_tows: true          # Warmstart entre tokens
  use_dra: true           # Rank adaptativo dinámico
  use_mso: true           # Detección de shortcuts lineales
  use_hfisc: true         # Inicialización óptima
  use_sgc: true           # Compresión de gradiente espectral
  use_nfr: true           # NMF flow recycling
  use_sbs: true           # STB bypass sampling
  sbs_p_stb: 0.3